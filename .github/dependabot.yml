version: 2
updates:
  # Python dependencies. requirements.txt uses ">=" floors, so every image
  # build already installs the newest release; a PR only raises the floor.
  # One monthly PR for all of them, and patch releases are skipped. Security
  # updates are separate and are not affected by these rules.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  # Base image in the Dockerfile. Moving to a new Python version is a decision
  # (wheels for WeasyPrint, Pillow and psycopg2 have to exist), so Python
  # major and minor bumps are made by hand, not proposed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
